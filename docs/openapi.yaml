openapi: 3.1.0
info:
  title: mob blog API
  version: 0.1.0
  description: GitHub Markdown + private R2. Success {data}; errors
    {error,requestId}. Frontend and API use the same origin. Admin requires
    Access; development+localhost only may use configured DEV_AUTH_TOKEN as
    Bearer. Runtime GITHUB_TOKEN is required even for a public repository.
    Article index supports at most 500 articles and 32 MiB each for total
    sources and serialized index.
servers:
  - url: /
    description: Same-origin production
  - url: http://localhost:8787
    description: Local development
paths:
  /api/health:
    get:
      operationId: health
      summary: Worker liveness; does not probe external services
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        const: ok
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/posts:
    get:
      operationId: listPublishedPosts
      summary: Published metadata sorted by first publication date descending
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 500
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - items
                      - total
                      - limit
                      - offset
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PostMetadata"
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/posts/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublishedPost
      summary: Published article; drafts and missing articles return 404
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PublicPost"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/session:
    get:
      operationId: session
      summary: Current administrator
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - email
                      - subject
                    properties:
                      email:
                        type: string
                        format: email
                      subject:
                        type: string
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/posts:
    get:
      operationId: listAdminPosts
      summary: All articles including drafts, markdown and SHA
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Post"
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/posts/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getAdminPost
      summary: Read latest article and SHA
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Post"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: savePost
      summary: Save Markdown to GitHub
      description: sha:null creates; current blob SHA updates. 409 requires manual
        merge. All media must be uploaded first. Managed media URLs must match
        the returned filename; merged media references cannot exceed 200.
        INVALID_MEDIA_URL/TOO_MANY_MEDIA_REFERENCES reject invalid links. Writes
        are serialized by the global SQLite Durable Object; missing binding
        returns COORDINATOR_NOT_CONFIGURED.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePostInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - post
                      - commitSha
                    properties:
                      post:
                        $ref: "#/components/schemas/Post"
                      commitSha:
                        type: string
                    additionalProperties: false
                additionalProperties: false
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - post
                      - commitSha
                    properties:
                      post:
                        $ref: "#/components/schemas/Post"
                      commitSha:
                        type: string
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePost
      summary: Delete article with expected SHA
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sha
              properties:
                sha:
                  type: string
                  pattern: ^[0-9a-f]{40}$
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - commitSha
                    properties:
                      commitSha:
                        type: string
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/uploads:
    post:
      operationId: createUpload
      summary: Start a 24-hour upload session
      description: Default maximum 1 GiB. <=8 MiB single, otherwise multipart with 8
        MiB slices.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - contentType
                - size
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                contentType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                    - image/avif
                    - video/mp4
                    - video/webm
                    - audio/mpeg
                    - audio/wav
                    - audio/ogg
                    - audio/mp4
                size:
                  type: integer
                  minimum: 1
                  maximum: 5368709120
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/UploadSession"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/uploads/cleanup:
    post:
      operationId: cleanupUploads
      summary: Retire expired upload state while retaining completed media
      description: Scans at most four upload directories per page. Pass the returned cursor until null. Newly cancelled uploads retain their tombstone for one day. Requires the mutation coordinator; no scheduled cleanup is configured.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 4096
              additionalProperties: false
      responses:
        "200":
          description: Completed files, media records and Git gallery entries are retained
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [cleaned, expired, cursor]
                    properties:
                      cleaned:
                        type: integer
                        minimum: 0
                      expired:
                        type: integer
                        minimum: 0
                      cursor:
                        type: [string, "null"]
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getUpload
      summary: Read session without uploaded part list
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/UploadSession"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: abortUpload
      summary: Cancel incomplete upload
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - aborted
                    properties:
                      aborted:
                        type: boolean
                        const: true
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/uploads/{id}/body:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: uploadSingle
      summary: Raw binary single-file upload; success finishes it
      description: Maximum 8 MiB. Retrying a completed single upload returns the media
        record.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/MediaRecord"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /api/admin/uploads/{id}/parts/{number}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      operationId: uploadPart
      summary: Raw multipart slice, index starting at 1
      description: Non-final slices must be exactly partSize bytes; final slice must
        exactly match remaining bytes.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - partNumber
                      - etag
                    properties:
                      partNumber:
                        type: integer
                        minimum: 1
                      etag:
                        type: string
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /api/admin/uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: completeUpload
      summary: Complete media; server collects ETags
      description: Idempotent completion. 409 UPLOAD_INCOMPLETE provides
        details.missingParts.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties: {}
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/MediaRecord"
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/media:
    get:
      operationId: listMedia
      summary: Completed media, up to 25 per page
      security:
        - CloudflareAccess: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - items
                      - cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaRecord"
                      cursor:
                        type:
                          - string
                          - "null"
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/media/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteMedia
      summary: Delete unreferenced media
      description: 409 MEDIA_IN_USE when any article including a draft references the media.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - deleted
                    properties:
                      deleted:
                        type: boolean
                        const: true
                    additionalProperties: false
                additionalProperties: false
        default:
          $ref: "#/components/responses/Error"
  /api/admin/media/{id}/file:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
    get:
      operationId: previewMedia
      summary: Private media preview
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: File bytes; HEAD has no body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Single byte range with Content-Range.
        "304":
          description: Not modified.
        "416":
          description: "Invalid range. Content-Range: bytes */size."
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: headPrivateMedia
      summary: Private media headers
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: File bytes; HEAD has no body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Single byte range with Content-Range.
        "304":
          description: Not modified.
        "416":
          description: "Invalid range. Content-Range: bytes */size."
        default:
          $ref: "#/components/responses/Error"
  /media/{id}/{filename}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: filename
        in: path
        required: true
        schema:
          type: string
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
    get:
      operationId: readMedia
      summary: Media referenced by published article, effective config, or explicit
        public gallery grant; otherwise 404
      responses:
        "200":
          description: File bytes; HEAD has no body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Single byte range with Content-Range.
        "304":
          description: Not modified.
        "416":
          description: "Invalid range. Content-Range: bytes */size."
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: headMedia
      summary: Media referenced by published article, effective config, or explicit
        public gallery grant; otherwise 404
      responses:
        "200":
          description: File bytes; HEAD has no body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Single byte range with Content-Range.
        "304":
          description: Not modified.
        "416":
          description: "Invalid range. Content-Range: bytes */size."
        default:
          $ref: "#/components/responses/Error"
  /api/activity:
    get:
      operationId: repositoryActivity
      summary: Daily commits and interval statistics for the configured repository and branch
      description: No query overrides. Reads shared GitHub activity config before using optional R2
        aggregate cache. Failed reads never become zero activity; stale snapshots retain their
        own date range.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ActivityResult"
        default:
          $ref: "#/components/responses/Error"
  /api/admin/gallery/storage:
    get:
      operationId: discoverStoredMedia
      summary: Discover supported unregistered R2 media without mutating GitHub
      description: Scans up to 100 keys per page. Empty items with a non-null cursor still require
        another page. Excludes internal caches/metadata and unfinished uploads.
      security:
        - CloudflareAccess: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - items
                      - cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/StoredMediaSource"
                      cursor:
                        type:
                          - string
                          - "null"
        default:
          $ref: "#/components/responses/Error"
  /api/admin/gallery/storage/file:
    get:
      operationId: previewStoredMedia
      summary: Private preview of an eligible R2 media source
      security:
        - CloudflareAccess: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: Range
          in: header
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Media bytes; private, no-store
        "206":
          description: Requested byte range
        "304":
          description: Unchanged; no body
        "416":
          description: Invalid byte range
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: headStoredMedia
      summary: Private preview of an eligible R2 media source
      security:
        - CloudflareAccess: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            maxLength: 1024
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Media metadata; no body
        "304":
          description: Unchanged; no body
        default:
          $ref: "#/components/responses/Error"
  /api/admin/gallery/storage/import:
    post:
      operationId: adoptStoredMedia
      summary: Idempotently adopt a current R2 object into the private GitHub gallery
      description: Managed uploads keep their ID. Theme/legacy sources are signature-checked and
        copied to a managed immutable object; originals remain. GitHub registration may be
        retried after copying succeeds. Changed source or occupied destination returns
        STORAGE_CONFLICT.
      security:
        - CloudflareAccess: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - etag
              properties:
                key:
                  type: string
                  maxLength: 1024
                etag:
                  type: string
                  maxLength: 200
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - item
                      - sha
                    properties:
                      item:
                        $ref: "#/components/schemas/GalleryItem"
                      sha:
                        type:
                          - string
                          - "null"
                      commitSha:
                        type: string
        default:
          $ref: "#/components/responses/Error"
  /api/site:
    get:
      operationId: siteSettings
      summary: Shared profile, social/friend links and navigation from GitHub
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      value: {}
        default:
          $ref: "#/components/responses/Error"
  /api/admin/settings/site:
    get:
      operationId: editSiteSettings
      summary: Read shared settings and optimistic editing SHA
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigDocument"
        default: &a1
          $ref: "#/components/responses/Error"
    put:
      operationId: saveSiteSettings
      summary: Atomically save GitHub text and references
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditableConfig"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigDocument"
        default: *a1
  /api/themes:
    get:
      operationId: availableThemes
      summary: Enabled local themes; declaration edits require deployment
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data: {}
        default:
          $ref: "#/components/responses/Error"
  /api/admin/themes:
    get:
      operationId: editThemeRegistry
      summary: Read complete theme registry
      security:
        - CloudflareAccess: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigDocument"
        default: &a1
          $ref: "#/components/responses/Error"
    put:
      operationId: saveThemeRegistry
      summary: Validate installed entries then save registry; redeploy to apply
      security:
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditableConfig"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ConfigDocument"
        default: *a1
  /api/themes/{id}/config/{document}:
    get:
      operationId: publicThemeConfig
      summary: Read an enabled theme configuration at runtime
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: document
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      value: {}
        default:
