        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Media bytes from private R2
          content:
            image/*:
              schema:
                type: string
                format: binary
        "304":
          description: ETag matched; no body
        default:
          $ref: "#/components/responses/Error"
