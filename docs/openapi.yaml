          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    CloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Valid Access JWT injected at edge after browser login. Browser
        normally sends CF_Authorization cookie.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
        description: Must equal SITE_ORIGIN; browsers set it automatically.
  schemas:
    ActivityConfig:
      type: object
      required:
        - enabled
        - title
        - days
        - timezone
        - github
      properties:
        enabled:
          type: boolean
        title:
          type: string
          minLength: 1
          maxLength: 100
        days:
          type: integer
          minimum: 30
          maximum: 366
        timezone:
          type: string
          maxLength: 100
          description: Valid IANA timezone, e.g. Asia/Hong_Kong
        github:
          type: object
          required:
            - enabled
            - title
          properties:
            enabled:
              type: boolean
            title:
              type: string
              minLength: 1
              maxLength: 100
          additionalProperties: false
      additionalProperties: false
      description: Optional shared config/site/settings.json activity field. Absent config defaults
        to disabled.
    ActivityResult:
      type: object
      required:
        - enabled
        - title
        - timezone
        - range
        - github
      properties:
        enabled:
          type: boolean
        title:
          type: string
        timezone:
          type: string
        range:
          type: object
          required:
            - from
            - to
            - days
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            days:
              type: integer
              minimum: 30
              maximum: 366
        github:
          type: object
          required:
            - title
            - repository
            - branch
            - url
            - status
            - updatedAt
            - daily
            - stats
          properties:
            title:
              type: string
            repository:
              type: string
            branch:
              type: string
            url:
              type: string
              format: uri
            status:
              type: string
              enum:
                - ok
                - stale
                - unavailable
                - disabled
            updatedAt:
              type:
                - string
                - "null"
              format: date-time
            daily:
              type:
                - array
                - "null"
              items:
                type: object
                required:
                  - date
                  - count
                properties:
                  date:
                    type: string
                    format: date
                  count:
                    type: integer
                    minimum: 0
            stats:
              type:
                - object
                - "null"
              required:
                - total
                - activeDays
                - peakDaily
                - longestStreakDays
                - currentStreakDays
              properties:
                total:
                  type: integer
                  minimum: 0
                activeDays:
                  type: integer
                  minimum: 0
                peakDaily:
                  type: integer
                  minimum: 0
                longestStreakDays:
                  type: integer
                  minimum: 0
                currentStreakDays:
                  type: integer
                  minimum: 0
    StoredMediaSource:
      type: object
      required:
        - key
        - etag
        - id
        - filename
        - contentType
        - size
        - createdAt
        - kind
        - digest
      properties:
        key:
          type: string
          maxLength: 1024
        etag:
          type: string
        id:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - managed
            - theme
            - legacy
        digest:
          type: string
          description: Deterministic source fingerprint, not a credential
    Post:
      type: object
      required:
        - slug
        - sha
        - title
        - markdown
        - description
        - tags
        - status
        - createdAt
        - updatedAt
        - publishedAt
        - cover
        - mediaIds
