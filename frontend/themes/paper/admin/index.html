<!doctype html><html lang="zh-CN" data-layout="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸间</title><link rel="stylesheet" href="/themes/paper/style.css"></head><body data-page="admin"><header class="paper-header"><a href="/" class="paper-brand" data-site-title>Nivek 的博客</a><nav><a href="/">首页</a><a href="/archive.html">文章</a><a href="/tags.html">标签</a><a href="/gallery.html" data-gallery-link>图库</a><a href="/about.html">关于</a><a href="/admin/">管理</a></nav></header><main id="main"><nav class="admin-tabs"><a href="/admin/">写作台</a><a href="/admin/gallery.html">图床</a><a href="/admin/settings.html">设置</a></nav><header class="page-heading"><p class="eyebrow">MY WRITING DESK</p><div class="heading-row"><h1>写点什么<span>。</span></h1></div><p class="quiet" id="who" aria-live="polite">正在确认登录…</p></header><div class="admin-grid"><aside class="side-card side"><div class="card-head"><p class="eyebrow">ARTICLES</p><a class="text-link" href="/admin/?new=1">新建 +</a></div><div id="post-list"></div></aside><form class="editor-card" id="editor"><div class="editor-head"><p class="eyebrow" id="mode">新建</p><a href="/archive.html" class="text-link">查看博客 ↗</a></div><div class="field"><label for="title">标题</label><input class="title-input" id="title" name="title" required maxlength="200" placeholder="给这段文字起个名字"></div><div class="metadata-grid"><div class="field"><label for="slug">文章地址</label><input id="slug" required maxlength="80" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="my-first-post"></div><div class="field"><label for="tags">标签，用逗号分隔</label><input id="tags" placeholder="日常, 笔记"></div></div><div class="field"><label for="description">摘要</label><input id="description" maxlength="2000" placeholder="用一两句话介绍这篇文章"></div><div class="field"><label for="cover">封面地址</label><input id="cover" type="url" placeholder="https://..."></div><div class="editor-toolbar"><span>Markdown</span><label class="button">插入媒体 · 支持拖放和粘贴<input id=
