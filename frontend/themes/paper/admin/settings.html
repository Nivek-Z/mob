<!doctype html><html lang="zh-CN" data-layout="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸间</title><link rel="stylesheet" href="/themes/paper/style.css"></head><body data-page="settings"><header class="paper-header"><a href="/" class="paper-brand" data-site-title>Nivek 的博客</a><nav><a href="/">首页</a><a href="/archive.html">文章</a><a href="/tags.html">标签</a><a href="/gallery.html" data-gallery-link>图库</a><a href="/about.html">关于</a><a href="/admin/">管理</a></nav></header><main id="main"><nav class="admin-tabs"><a href="/admin/">写作台</a><a href="/admin/gallery.html">图床</a><a href="/admin/settings.html">设置</a></nav><h1>整理纸间</h1><p>个人资料与链接全站共用，阅读设置只属于纸间。</p><label>选择配置<select id="paper-doc"><option value="reading">阅读外观</option><option value="site">公共资料和友链</option><option value="themes">主题可用性</option><option value="categories">图床分类</option></select></label><section id="paper-controls"><label>强调色<input id="paper-accent" type="color"></label><label>正文宽度<input id="paper-width" type="number" min="560" max="1200"></label><label>字号<input id="paper-size" type="number" min="14" max="26"></label><label>首页标题<input id="paper-heading"></label><label>首页介绍<textarea id="paper-subtitle"></textarea></label><label><input id="paper-gallery" type="checkbox">显示图库入口</label></section><fieldset id="paper-activity-controls" hidden><legend>仓库活动（所有主题共用）</legend><label><input id="paper-activity-enabled" type="checkbox">显示活动区块</label><label>区块标题<input id="paper-activity-title" maxlength="100"></label><label>显示天数<input id="paper-activity-days" type="number" min="30" max="366" step="1"></label><label>统计时区<input id="paper-activity-timezone" placeholder="Asia/Hong_Kong"></label><label><input id="paper-activity-github-enabled" type="checkbox">显示 GitHub 提交活动</label><label>图表标题<input id="paper-activity-github-title" maxlength="100"></label><p>统计此博客绑定仓库与分支的提交；设置保存后刷新首页生效。</p></fieldset><label>配置 JSON<textarea id="paper-json" rows="20" spellcheck="false"></textarea></label><label>额外媒体 ID<input id="paper-refs"></label><p>公共资料使用 profile、socials、friends；每条链接包含 label 和 url。</p><label>上传头像或展示图片<input id="paper-file" type="file" accept="image/*,audio/*,video/*"></label><div id="paper-uploads"></div><button id="paper-save">保存到仓库</button><p id="paper-note" aria-live="polite"></p></main><footer><p data-profile-bio></p><div data-socials></div><div data-friends></div></footer><script src="/core/api.js" defer></script><script src="/core/vendor/marked.umd.js" defer></script><script src="/core/vendor/purify.min.js" defer></script><script src="/core/markdown.js" defer></script><script src="/core/runtime.js" defer></script><script src="/themes/paper/reading.js" defer></script><script src="/core/upload.js" defer></script><script src="/admin/assets/paper/settings.js" defer></script></body></html>
