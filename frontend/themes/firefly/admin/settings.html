<!doctype html>
<html lang="zh-CN" data-theme="dark" data-layout="firefly">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>设置 · Firefly-Mod</title>
    <script src="/themes/firefly/js/theme.js"></script>
    <link rel="stylesheet" href="/themes/firefly/css/site.css" />
    <link rel="stylesheet" href="/admin/assets/firefly/admin.css" />
  </head>
  <body class="admin-page">
    <a class="skip-link" href="#admin-main">跳到主内容</a>
    <header class="admin-topbar">
      <a class="admin-brand" href="/admin/"
        ><span>✳</span>Firefly-Mod <small>管理</small></a
      >
      <div class="admin-top-actions">
        <span data-save-state role="status">已同步</span
        ><button type="button" data-theme-toggle aria-label="切换明暗模式">
          ◐</button
        ><a href="/" target="_blank" rel="noopener">前台 ↗</a>
      </div>
    </header>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <nav aria-label="管理导航">
          <a href="/admin/"><span>✎</span>写作台</a
          ><a href="/admin/gallery.html"><span>▧</span>图床</a
          ><a href="/admin/settings.html" aria-current="page"
            ><span>⚙</span>设置</a
          >
        </nav>
        <div class="admin-account">
          <small>当前管理员</small><span id="who">正在验证…</span
          ><small>⌘ / Ctrl S 快速保存</small>
        </div>
      </aside>
      <main id="admin-main" class="admin-main">
        <div class="admin-heading">
          <div>
            <p class="eyebrow">MAKE IT YOURS</p>
            <h1>设置你的空间</h1>
            <p class="muted">
              公共资料全站共用，展示风格由 Firefly-Mod 自己定义。
            </p>
          </div>
          <a class="button quiet-button" href="/" target="_blank" rel="noopener"
            >查看前台 ↗</a
          >
        </div>
        <section class="admin-panel">
          <div class="settings-document-bar">
            <label class="field"
              >配置范围<select id="settings-document">
                <option value="appearance">Firefly-Mod · 展示风格</option>
                <option value="site">全站 · 公共资料</option>
                <option value="categories">全站 · 图床分类</option>
                <option value="themes">全站 · 主题切换</option>
              </select></label
            ><button id="settings-reload" type="button">重新读取</button
            ><span id="settings-path" class="muted"></span>
          </div>
        </section>
        <div class="settings-layout">
          <nav
            id="settings-sections"
            class="settings-section-nav"
            aria-label="设置分区"
          ></nav>
          <section class="admin-panel">
            <h2 id="settings-section-title"></h2>
            <p id="settings-section-hint" class="muted"></p>
            <div id="settings-fields" class="settings-fields"></div>
          </section>
        </div>
        <details class="admin-panel advanced-settings">
          <summary>高级编辑 · 完整 JSON 与媒体引用</summary>
          <p class="muted">
            未列出的自定义字段也会保留。编辑 JSON 后可应用到表单，或直接保存。
          </p>
          <label class="field"
            >完整配置<textarea
              id="settings-json"
              rows="18"
              spellcheck="false"
              aria-label="完整配置 JSON"
            ></textarea></label
          ><button id="settings-apply-json" type="button">
            应用 JSON 到表单</button
          ><label class="field"
            >额外媒体 ID（逗号分隔）<input id="settings-refs" /><small
              >图片链接中的 ID
              自动收集。这里只填写配置以其他方式引用的素材。</small
            ></label
          >
        </details>
        <div class="save-bar">
          <p id="settings-note" role="status" aria-live="polite">正在读取…</p>
          <button id="settings-save" class="primary" type="button">
            保存设置 <small>⌘ / Ctrl S</small>
          </button>
        </div>
      </main>
    </div>
    <script src="/core/api.js"></script>
    <script src="/core/vendor/marked.umd.js"></script>
    <script src="/core/vendor/purify.min.js"></script>
    <script src="/core/markdown.js"></script>
    <script src="/core/upload.js"></script>
    <script src="/themes/firefly/js/site.js"></script>
    <script src="/admin/assets/firefly/ui.js"></script>
    <script src="/admin/assets/firefly/settings.js"></script>
  </body>
</html>
