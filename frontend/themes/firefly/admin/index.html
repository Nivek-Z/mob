<!doctype html>
<html lang="zh-CN" data-theme="dark" data-layout="firefly">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>写作台 · Firefly-Mod</title>
    <script src="/themes/firefly/js/theme.js"></script>
    <link rel="stylesheet" href="/themes/firefly/css/site.css" />
    <link rel="stylesheet" href="/admin/assets/firefly/admin.css" />
  </head>
  <body class="admin-page">
    <a class="skip-link" href="#admin-main">跳到主内容</a>
    <header class="admin-topbar">
      <a class="admin-brand" href="/admin/"
        ><span>✳</span>Firefly-Mod <small>管理</small></a
      >
      <div class="admin-top-actions">
        <span data-save-state role="status">已同步</span
        ><button type="button" data-theme-toggle aria-label="切换明暗模式">
          ◐</button
        ><a href="/" target="_blank" rel="noopener">前台 ↗</a>
      </div>
    </header>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <nav aria-label="管理导航">
          <a href="/admin/" aria-current="page"><span>✎</span>写作台</a
          ><a href="/admin/gallery.html"><span>▧</span>图床</a
          ><a href="/admin/settings.html"><span>⚙</span>设置</a>
        </nav>
        <div class="admin-account">
          <small>当前管理员</small><span id="who">正在验证…</span
          ><small>⌘ / Ctrl S 快速保存</small>
        </div>
      </aside>
      <main id="admin-main" class="admin-main">
        <div class="admin-heading">
          <div>
            <p class="eyebrow">WRITE SOMETHING</p>
            <h1>写作台</h1>
            <p class="muted">写下想法，拖入素材，预览后再发布。</p>
          </div>
          <button id="new-post" class="primary" type="button">＋ 新文章</button>
        </div>
        <div class="editor-layout">
          <aside class="post-browser admin-panel">
            <h2>文章</h2>
            <label class="sr-only" for="post-search">搜索文章</label
            ><input
              id="post-search"
              type="search"
              placeholder="搜索标题、标签…"
            /><label class="sr-only" for="post-filter">文章状态</label
            ><select id="post-filter">
              <option value="all">全部文章</option>
              <option value="published">已发布</option>
              <option value="draft">草稿</option>
            </select>
            <div id="post-list" class="post-list" aria-live="polite"></div>
            <button id="posts-reload" type="button" class="quiet-button">
              刷新列表
            </button>
          </aside>
          <form id="editor" class="editor-card admin-panel">
            <div class="editor-card-heading">
              <span id="mode" class="badge">新建</span
              ><span id="editor-stats" class="muted"></span
              ><a id="post-link" target="_blank" rel="noopener" hidden
                >查看文章 ↗</a
              >
            </div>
            <label class="field"
              ><span class="sr-only">文章标题</span
              ><input
                id="title"
                class="title-input"
                required
                maxlength="200"
                placeholder="给这篇记录一个标题"
            /></label>
            <details class="post-metadata">
              <summary>文章信息 · 路径、摘要、标签与封面</summary>
              <div class="metadata-grid">
                <label class="field"
                  >文章路径<input
                    id="slug"
                    required
                    maxlength="80"
                    pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
                    placeholder="自动生成，也可自定义"
                  /><small
                    >保存后固定，使用小写字母、数字和短横线。</small
                  ></label
                ><label class="field"
                  >标签<input id="tags" placeholder="学习, 生活" /><small
                    >多个标签用逗号分隔。</small
                  ></label
                ><label class="field full"
                  >摘要<textarea
                    id="description"
                    maxlength="2000"
                    rows="2"
                    placeholder="在文章列表展示的简短介绍"
                  ></textarea></label
                ><label class="field full"
                  >封面地址<input id="cover" placeholder="可留空"
                /></label>
                <div class="field full">
                  <img
                    id="cover-preview"
                    class="image-preview"
                    alt="文章封面预览"
                    hidden
                  />
                  <div class="image-actions">
                    <button id="cover-choose" type="button">
                      从图床选择封面</button
                    ><label class="button"
                      >上传封面<input
                        id="cover-file"
                        type="file"
                        accept="image/jpeg,image/png,image/gif,image/webp,image/avif"
                        hidden /></label
                    ><button
                      id="cover-clear"
                      type="button"
                      class="quiet-button"
                    >
                      清除封面
                    </button>
                  </div>
                </div>
              </div>
            </details>
            <div class="editor-toolbar">
              <div class="format-tools" aria-label="Markdown 格式">
                <button type="button" data-format="heading" title="二级标题">
                  H2</button
                ><button type="button" data-format="bold" title="加粗">
                  <b>B</b></button
                ><button type="button" data-format="italic" title="斜体">
                  <i>I</i></button
                ><button type="button" data-format="link" title="插入链接">
                  链接</button
                ><button type="button" data-format="code" title="代码块">
                  代码</button
                ><button type="button" data-format="quote" title="引用">
                  引用</button
                ><button type="button" data-format="list" title="列表">
                  列表</button
                ><button id="insert-media" type="button">图床图片</button
                ><label class="button"
                  >上传素材<input
                    id="file"
                    type="file"
                    accept="image/jpeg,image/png,image/gif,image/webp,image/avif,video/mp4,video/webm,audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/webm,audio/flac"
                    multiple
                    hidden
                /></label>
              </div>
              <div class="pane-switch" aria-label="编辑视图">
                <button type="button" data-view="write" aria-pressed="true">
                  写作</button
                ><button type="button" data-view="split" aria-pressed="false">
                  对照</button
                ><button type="button" data-view="preview" aria-pressed="false">
                  预览
                </button>
              </div>
            </div>
            <div id="upload-queue" role="status" aria-live="polite"></div>
            <div id="editor-panes" class="editor-panes" data-view="write">
              <label class="sr-only" for="markdown">Markdown 正文</label
              ><textarea
                id="markdown"
                spellcheck="false"
                placeholder="从这里开始写。支持 Markdown，也可以拖入或粘贴图片。"
              ></textarea>
              <article
                id="preview"
                class="markdown"
                aria-label="文章预览"
              ></article>
            </div>
            <div class="save-bar actions">
              <p id="note" role="status" aria-live="polite"></p>
              <button id="remove" class="danger" type="button" hidden>
                删除</button
              ><button id="save-draft" type="submit" data-status="draft">
                保存草稿</button
              ><button
                id="save-publish"
                type="submit"
                class="primary"
                data-status="published"
              >
                发布文章
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="/core/api.js"></script>
    <script src="/core/vendor/marked.umd.js"></script>
    <script src="/core/vendor/purify.min.js"></script>
    <script src="/core/markdown.js"></script>
    <script src="/core/upload.js"></script>
    <script src="/themes/firefly/js/site.js"></script>
    <script src="/admin/assets/firefly/ui.js"></script>
    <script src="/admin/assets/firefly/editor.js"></script>
  </body>
</html>
