<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理 - Nivek</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">Nivek</a>
    <nav class="nav">
      <a href="/">主页</a>
      <a href="/archive.html">归档</a>
      <a href="/admin/" aria-current="page">管理</a>
    </nav>
  </header>
  <main class="admin">
    <p class="quiet" id="who">正在确认登录…</p>
    <div class="admin-grid">
      <aside class="card side">
        <p class="kicker">文章</p>
        <p><a href="/admin/?new=1">写一篇</a></p>
        <div id="post-list"></div>
      </aside>
      <form class="card" id="editor">
        <p class="kicker" id="mode">新建</p>
        <div class="field"><input class="title-input" id="title" name="title" required maxlength="200" placeholder="标题"></div>
        <div class="field"><label for="slug">SLUG</label><input id="slug" required maxlength="80" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="my-first-post"></div>
        <div class="field"><label for="description">摘要</label><input id="description" maxlength="2000"></div>
        <div class="field"><label for="tags">标签，用逗号分隔</label><input id="tags" placeholder="日常, 笔记"></div>
        <div class="field"><label for="cover">封面地址</label><input id="cover" placeholder="https://..."></div>
        <div class="toolbar">
          <label class="button">插入图片<input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,video/mp4,video/webm" hidden></label>
        </div>
        <div class="split">
          <div class="field"><label for="markdown">正文</label><textarea id="markdown" required></textarea></div>
          <div><p class="toolbar">预览</p><div class="preview markdown" id="preview"></div></div>
        </div>
        <div class="actions">
          <button type="submit" data-status="draft">存草稿</button>
          <button class="solid" type="submit" data-status="published">发布</button>
          <button class="warn" type="button" id="remove" hidden>删除</button>
        </div>
        <p class="note" id="note"></p>
      </form>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/bot.js"></script>
</body>
</html>
